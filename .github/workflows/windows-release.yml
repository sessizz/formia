name: Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release to receive the packages
        required: true
        default: v1.0.0
      source_ref:
        description: Full commit SHA used by the release
        required: true
        default: 12a1d94

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Set build output directory
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$env:RUNNER_TEMP\formia-target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Verify draft release and source
        shell: pwsh
        run: |
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed' }
          if (-not $release.isDraft) { throw 'Only draft releases can receive these packages' }
          $head = git rev-parse HEAD
          if ($head -ne $release.targetCommitish) { throw 'Release target differs from the checked-out commit' }
      - name: Rust tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
      - name: Build installer and portable executable
        shell: pwsh
        run: |
          ./build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Stage release packages
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and application version differ' }
          $installers = @(Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item $installers[0].FullName "release-assets/Formia_${version}_x64-setup.exe"
          Copy-Item "$env:CARGO_TARGET_DIR/release/formia.exe" "release-assets/Formia_${version}_x64-portable.exe"
          Get-ChildItem release-assets/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: formia-windows-x64
          path: release-assets/*
          if-no-files-found: error
      - name: Upload to draft release
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG release-assets/* --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
